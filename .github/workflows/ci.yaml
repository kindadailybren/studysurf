name: CI Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/**'

jobs:
  validate-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript & Build Check
        working-directory: frontend
        run: npm run build

  validate-infra-and-synth:
    name: CDK Infrastructure & Synth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install Infra Dependencies
        working-directory: infra
        run: npm ci

      - name: Compile Infra TypeScript
        working-directory: infra
        run: npm run build

      - name: CDK Synthesize Stacks
        working-directory: infra
        run: |
          npx cdk synth dev-StatefulStack dev-StatelessStack
          npx cdk synth staging-StatefulStack staging-StatelessStack
          npx cdk synth prod-StatefulStack prod-StatelessStack

  validate-backend:
    name: Backend Code Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        working-directory: infra/lambdaFunctions/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Compilation
        working-directory: infra/lambdaFunctions/backend
        run: |
          python -m compileall -q .
